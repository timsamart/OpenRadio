name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets the nightly catalog job redeploy after it refreshes station health.
  # A push made with GITHUB_TOKEN does NOT trigger `on: push`, so without this
  # the site would keep serving yesterday's catalog.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Resolve Pages base path
        id: base
        # A project site lives at /<repo>/; a user or org site (a repo literally
        # named <owner>.github.io) lives at the origin root. Deriving this from
        # GITHUB_REPOSITORY rather than hardcoding means a rename cannot quietly
        # ship a build whose asset URLs point at the old path.
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Building for base: $base"

      - name: Build
        env:
          PAGES_BASE: ${{ steps.base.outputs.base }}
        run: npx vite build

      - name: Verify asset paths match the deploy path
        # Cheap insurance against the failure mode that produces a blank white
        # page on Pages: a bundle whose asset URLs do not match where it is
        # actually served from.
        run: |
          base="${{ steps.base.outputs.base }}"
          grep -q "src=\"${base}assets/" dist/index.html \
            || { echo "::error::index.html does not reference ${base}assets/"; exit 1; }
          grep -q "\"start_url\":\"${base}\"" dist/manifest.webmanifest \
            || { echo "::error::manifest start_url is not ${base}"; exit 1; }
          test -f dist/catalog.json || { echo "::error::catalog.json missing from build"; exit 1; }
          echo "asset paths, manifest scope and catalog all verified for ${base}"

      - name: SPA fallback for deep links
        # GitHub Pages has no rewrite rules, so a cold load of
        # /OpenRadio/radio/sfera would 404. Pages serves 404.html for unknown
        # paths, so shipping the shell as 404.html lets the router boot and
        # read the path. The status code is still 404 — see README.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
