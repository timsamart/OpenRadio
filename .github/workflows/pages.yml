name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Project Pages serve from /<repo>/, not the origin root.
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: SPA fallback for deep links
        # GitHub Pages has no rewrite rules, so a cold load of
        # /OpenRadio/radio/sfera would 404. Pages serves 404.html for unknown
        # paths, so shipping the shell as 404.html lets the router boot and
        # read the path. The status code is still 404 — see README.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
